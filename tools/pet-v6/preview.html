<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星岛探险队 · 第三阶段方向稿</title><link rel="stylesheet" href="preview.css"><style>
*{box-sizing:border-box}body{margin:0;padding:26px;background:#eef1ef;color:#183443;font:16px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif}h1{margin:0;font-size:26px;letter-spacing:.05em}p{margin:7px 0 20px;color:#566e78}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1240px;margin:0 auto}.intro{max-width:1240px;margin:0 auto 22px}.sample{background:#fff;border:1px solid #c5d2d4;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px #12344512}.sample h2{margin:18px 20px 0;font-size:20px}.sample .hint{margin:2px 20px 14px;font-size:13px}.portrait{height:430px;margin:0 12px}.actions{display:flex;flex-wrap:wrap;gap:7px;padding:14px 16px 18px}.actions button{font:inherit;font-size:14px;min-height:44px;padding:8px 12px;border:1px solid #b8cbce;border-radius:10px;background:#f4f7f4;color:#214a58;cursor:pointer}.actions button:focus-visible{outline:3px solid #568f9c;outline-offset:2px}.reduced{display:inline-flex;gap:8px;align-items:center;margin-top:8px}.reduced input{width:18px;height:18px}.status{min-height:24px;margin:0 20px;color:#28566a;font-size:13px}@media(max-width:800px){body{padding:14px}.gallery{grid-template-columns:1fr}.portrait{height:340px}h1{font-size:22px}}@media(max-width:360px){.portrait{height:260px}.sample h2{font-size:18px}}
</style></head><body><div class="intro"><h1>星岛探险队</h1><p>第三阶段对照：晶叶幼龙 × 太空探险水豚。本页复用正式渲染器；成长、背包与资源消耗请在家庭首页体验。</p><label class="reduced"><input id="reduced" type="checkbox">减少动态，保留接触与效果</label></div><main class="gallery"><section class="sample"><h2>踏星小龙</h2><p class="hint">晶角 · 天生叶翼 · 玉石鳞甲 · 探险护具</p><div id="plant-preview" class="portrait"></div><div id="plant-status" class="status">第三阶段 · 起航基地</div><div class="actions" data-kind="plant"></div></section><section class="sample"><h2>星岛探员</h2><p class="hint">压力舱罩 · 分段太空服 · 推进背包 · 能量核心</p><div id="capybara-preview" class="portrait"></div><div id="capybara-status" class="status">第三阶段 · 起航基地</div><div class="actions" data-kind="capybara"></div></section></main><script src="../../pet.js"></script><script src="renderer.js"></script><script>
(function(){'use strict';var timers={},active={plant:'idle',capybara:'idle'},names={idle:'待机',pet:'摸摸',feed:'投喂能量果',wash:'星露清洁',train:'训练接球',celebrate:'成长光环',unlock:'展开星图'},kinds=['plant','capybara'];function draw(kind,reaction){active[kind]=reaction;document.getElementById(kind+'-preview').innerHTML=window.FamilyPetV6.render({kind:kind,stage:3,framing:'hero',sceneId:'home',reaction:reaction,reducedMotion:document.getElementById('reduced').checked,instanceId:kind+'-direction'});document.getElementById(kind+'-status').textContent=reaction==='idle'?'第三阶段 · 起航基地':names[reaction]+' · 2.7 秒';}window.renderPetPreview=function(kind,reaction,reduced){if(typeof reduced==='boolean'){document.getElementById('reduced').checked=reduced;}clearTimeout(timers[kind]);draw(kind,reaction);};kinds.forEach(function(kind){var bar=document.querySelector('[data-kind="'+kind+'"]');Object.keys(names).forEach(function(reaction){var button=document.createElement('button');button.type='button';button.setAttribute('data-reaction',reaction);button.textContent=names[reaction];button.addEventListener('click',function(){clearTimeout(timers[kind]);draw(kind,reaction);if(reaction!=='idle'){timers[kind]=setTimeout(function(){draw(kind,'idle');},2700);}});bar.appendChild(button);});draw(kind,'idle');});document.getElementById('reduced').addEventListener('change',function(){kinds.forEach(function(kind){draw(kind,active[kind]);});});}());
</script></body></html>

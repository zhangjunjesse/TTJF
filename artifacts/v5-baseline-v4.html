/* v0.4: frequent points, a lightweight growth companion, and clear daily reminders. */

  50% { opacity: 1; }
}
@-webkit-keyframes pet-happy-munch {
  0%, 100% { -webkit-transform: translateY(0) rotate(0); }
  50% { -webkit-transform: translateY(-2px) rotate(.8deg); }
}
@keyframes pet-happy-munch {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-2px) rotate(.8deg); }
}
@-webkit-keyframes pet-little-hop {
  0%, 100% { -webkit-transform: translateY(0) scale(1, 1); }
  18% { -webkit-transform: translateY(1px) scale(1.025, .975); }
  45% { -webkit-transform: translateY(-9px) rotate(-2deg); }
  70% { -webkit-transform: translateY(0) scale(1.015, .985); }
}
@keyframes pet-little-hop {
  0%, 100% { transform: translateY(0) scale(1, 1); }
  18% { transform: translateY(1px) scale(1.025, .975); }
  45% { transform: translateY(-9px) rotate(-2deg); }
  70% { transform: translateY(0) scale(1.015, .985); }
}
/* This group already carries the ball's positioning transform. Include it in
   each keyframe rather than losing the SVG transform attribute during play. */
@-webkit-keyframes pet-ball-hop {
  0%, 100% { -webkit-transform: translate(418px, 255px); }
  45% { -webkit-transform: translate(418px, 245px); }
}
@keyframes pet-ball-hop {
  0%, 100% { transform: translate(418px, 255px); }
  45% { transform: translate(418px, 245px); }
}
@-webkit-keyframes pet-cheer {
  0%, 100% { opacity: .8; -webkit-transform: translateY(0); }
  50% { opacity: 1; -webkit-transform: translateY(-5px); }
}
@keyframes pet-cheer {
  0%, 100% { opacity: .8; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-5px); }
}

/* Do not reset transforms here: static SVG translations position leaves,
   faces and props. Only the animated part must stop. Reaction drawings and
   speech bubbles remain visible; no animation is needed to understand them. */
.pet-reduced .pet-character-motion,
.pet-reduced .pet-leaf-crown,
.pet-reduced .pet-flower-crown,
.pet-reduced .pet-affection,
.pet-reduced .pet-celebration,
.pet-reduced .pet-sunbeams,
.pet-reduced .pet-water-drops,
.pet-reduced .pet-ball {
  -webkit-animation: none !important;
  animation: none !important;
  transition: none !important;
}
@media (prefers-reduced-motion: reduce) {
  .pet-scene .pet-character-motion,
  .pet-scene .pet-leaf-crown,
  .pet-scene .pet-flower-crown,
  .pet-scene .pet-affection,
  .pet-scene .pet-celebration,
  .pet-scene .pet-sunbeams,
  .pet-scene .pet-water-drops,
  .pet-scene .pet-ball {
    -webkit-animation: none !important;
    animation: none !important;
    transition: none !important;
  }
}
</style>

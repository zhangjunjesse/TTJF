/* v0.5: full viewport interactions and a close, playable growth companion. */
* { box-sizing: border-box; }

.field { display: block; min-width: 0; margin-bottom: 19px; }

  <style>/* FamilyPet v0.6 motion. Namespaced SVG groups, no filters or WebGL; UI resets after 2700ms. */
.pet-v6 { display:block; width:100%; height:100%; overflow:hidden; --pet-feed-angle:-76deg; --pet-train-angle:-52deg; --pet-feed-y:148px; }

.pet-v6.pet-reaction-feed .pet-arm-front { animation:pet-v6-lift 2700ms ease-in-out both; }

.pet-v6.pet-reaction-train .pet-wing { animation:pet-v6-wing 2700ms ease-in-out both; }
.pet-v6 .pet-ball-motion { transform:translate(338px,192px); animation:pet-v6-ball 2700ms ease-in-out both; }
.pet-v6 .pet-train-trail { animation:pet-v6-trail 2700ms ease-out both; }
.pet-v6 .pet-train-impact { transform-origin:322px 190px; animation:pet-v6-impact 2700ms ease-out both; }
.pet-v6.pet-reaction-celebrate .pet-actor { animation:pet-v6-proud 2700ms ease-in-out both; }
.pet-v6.pet-reaction-celebrate .pet-wing { animation:pet-v6-wing 2700ms ease-in-out both; }
.pet-v6 .pet-victory-ring { transform-origin:235px 202px; animation:pet-v6-ring 2700ms ease-out both; }
.pet-v6 .pet-victory-shard { transform-origin:235px 202px; animation:pet-v6-shards 2700ms ease-out both; }
.pet-v6 .pet-star-map { transform-origin:235px 154px; animation:pet-v6-map 2700ms ease-out both; }
@keyframes pet-v6-visor { 0%,8%,100%{transform:translateY(0) scaleY(1);opacity:1}28%,82%{transform:translateY(-18px) scaleY(.6);opacity:.75} }
